dependencies:
  espressif/cjson: "*"
  espressif/esp_codec_dev: ^1.6.2
  # WM8960 register-level codec driver for the Waveshare WM8960 Audio HAT. See
  # main/features/audio/wm8960_manager.hpp.
  jonlidgard/wm8960: ^0.0.3
  # LittleFS driver for the "littlefs" data partition (main/partitions.csv). See
  # main/features/filesystem/littlefs_manager.hpp.
  joltwallet/littlefs: ^1.20.3
  # Wi-Fi + Bluetooth LE over the ESP32-C6 co-processor (SDIO link). See
  # main/features/wifi/wifi_manager.hpp and main/features/ble/ble_manager.hpp.
  espressif/esp_wifi_remote:
    version: '>=1.3.1'
    rules:
    - if: target in [esp32p4, esp32h2]
  espressif/esp_hosted:
    version: '*'
    rules:
    - if: target in [esp32p4, esp32h2]
  # NimBLE central-role GATT client helper ("peer" service/characteristic/descriptor cache),
  # shipped with ESP-IDF itself; reused by main/features/ble/ble_hid_host.hpp and main/features/ble/ble_midi_host.hpp.
  nimble_central_utils:
    path: ${IDF_PATH}/examples/bluetooth/nimble/common/nimble_central_utils
  waveshare/esp_lcd_jd9365_10_1: ^2.0.0
  lvgl/lvgl: ^9.3.0
  espressif/esp_lvgl_port: ^2.9.0
