<h2>What it's for</h2>
<p>Same idea as Link In, but bundles four independent signals into one widget so you don't need four
separate Link In widgets cluttering the canvas.</p>
<h2>Inputs</h2>
<p><span class="port-label">1–4</span> — four independent signals, each sent to its matching numbered input on a Link Out 4× elsewhere in the patch.</p>
