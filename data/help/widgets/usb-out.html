<h2>What it's for</h2>
<p>Sends the final stereo mix out over USB audio, so ESPRESSYNTH can act as a USB audio interface
into a computer, DAW, or USB audio device.</p>
<h2>Inputs</h2>
<ul>
<li><span class="port-label">In L / In R</span> — the stereo signal to send.</li>
<li><span class="port-label">Volume</span> — the output level.</li>
<li><span class="port-label">Mute (Gate)</span> — silences the output without unpatching it.</li>
</ul>
