<h2>What it's for</h2>
<p>Divides one CV signal by another. Useful whenever you need a ratio between two values rather than
a sum or product — for example scaling one modulation source by how large another one currently
is.</p>
<h2>Inputs</h2>
<ul><li><span class="port-label">In 1 / In 2</span> — In 1 is divided by In 2.</li></ul>
<h2>Output</h2>
<p><span class="port-label">Out</span> — In 1 ÷ In 2.</p>
