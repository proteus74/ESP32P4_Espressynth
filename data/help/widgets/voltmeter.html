<h2>What it's for</h2>
<p>Displays the current value of a CV signal as a readable number/needle, like a multimeter for your
patch. Handy for checking exactly what voltage a knob, envelope, or other CV source is currently
putting out.</p>
<h2>Input</h2>
<p><span class="port-label">In</span> — the CV signal to measure.</p>
