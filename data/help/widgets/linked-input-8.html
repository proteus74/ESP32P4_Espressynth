<h2>What it's for</h2>
<p>Same idea as Link In, but bundles eight independent signals into one widget for very busy patches
where even Link In 4× isn't enough.</p>
<h2>Inputs</h2>
<p><span class="port-label">1–8</span> — eight independent signals, each sent to its matching numbered input on a Link Out 8× elsewhere in the patch.</p>
