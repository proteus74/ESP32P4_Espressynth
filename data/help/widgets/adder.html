<h2>What it's for</h2>
<p>Adds two CV signals together. Handy for combining two modulation sources (e.g. an LFO plus an
envelope) into one signal, or offsetting one CV by another.</p>
<h2>Inputs</h2>
<ul><li><span class="port-label">In 1 / In 2</span> — the two signals to add.</li></ul>
<h2>Output</h2>
<p><span class="port-label">Out</span> — In 1 + In 2.</p>
