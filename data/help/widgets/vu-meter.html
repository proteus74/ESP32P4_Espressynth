<h2>What it's for</h2>
<p>A vertical VU-style level meter — shows you how loud an audio signal is in real time, just like
the level meters on a mixing desk, so you can check for clipping or just see how hot a signal is
running.</p>
<h2>Input</h2>
<p><span class="port-label">In</span> — the audio signal to meter.</p>
