<h2>What it's for</h2>
<p>Combines several signals into one — the same job a mixer channel strip does, summing multiple
sound sources so they can share one output or effect.</p>
<h2>Inputs</h2>
<p><span class="port-label">In 1, In 2, …</span> — the signals to mix together (add more inputs from the widget's settings).</p>
<h2>Output</h2>
<p><span class="port-label">Out</span> — the combined signal.</p>
