<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Widget Help</title>
<link rel="icon" type="image/png" href="/static/img/FavLogo.png?v=20260910-64px">
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-border: #334155;
    --text: #e2e8f0;
    --accent: #38bdf8;
  }
  * {
    box-sizing: border-box;
  }
  html, body {
    height: 100%;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .help-page {
    max-width: 720px;
    margin: 0 auto;
    padding: 2rem 1.5rem 3rem;
  }
  .help-back {
    display: inline-block;
    margin-bottom: 1.5rem;
    color: var(--accent);
    text-decoration: none;
    font-size: 0.9rem;
  }
  .help-back:hover {
    text-decoration: underline;
  }
  .help-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 0.75rem;
    padding: 1.5rem 1.75rem;
  }
  .help-card h1 {
    margin: 0 0 0.25rem;
    font-size: 1.4rem;
  }
  .help-card .help-type {
    margin: 0 0 1.25rem;
    color: #94a3b8;
    font-size: 0.85rem;
    font-variant-numeric: tabular-nums;
  }
  .help-placeholder {
    border: 1px dashed var(--card-border);
    border-radius: 0.5rem;
    padding: 1.25rem;
    color: #94a3b8;
    font-size: 0.95rem;
    line-height: 1.5;
  }
  /* Styling for the injected per-widget fragment (data/help/widgets/<type>.html) */
  .help-body {
    font-size: 0.98rem;
    line-height: 1.6;
  }
  .help-body h2 {
    font-size: 1.05rem;
    margin: 1.4rem 0 0.5rem;
    color: var(--text);
  }
  .help-body h2:first-child {
    margin-top: 0;
  }
  .help-body p {
    margin: 0 0 0.9rem;
  }
  .help-body ul {
    margin: 0 0 0.9rem;
    padding-left: 1.3rem;
  }
  .help-body li {
    margin: 0 0 0.4rem;
  }
  .help-body li:last-child {
    margin-bottom: 0;
  }
  .help-body code {
    background: rgba(148, 163, 184, 0.15);
    border-radius: 0.25rem;
    padding: 0.1rem 0.35rem;
    font-size: 0.9em;
  }
  .help-body .port-label {
    color: var(--accent);
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="help-page">
  <a class="help-back" href="/">← Back to ESPRESSYNTH</a>
  <div class="help-card">
    <h1 id="helpTitle">Widget Help</h1>
    <p class="help-type" id="helpType"></p>
    <div class="help-body" id="helpBody">
      <div class="help-placeholder" id="helpPlaceholder">
        Help content for this widget is not written yet. This page will explain what the
        widget does, its inputs/outputs, and how to use it.
      </div>
    </div>
  </div>
</div>

<script>
  // Mirrors the "label" field of WIDGET_TYPES in static/js/main.js - kept as a
  // small standalone copy so this help page never needs to load the (huge)
  // main app script just to show a friendly title.
  const WIDGET_LABELS = {
    "midi-in": "Midi-In", "midi-split": "Midi-Split",
    "fm-oscillator": "Oscillator", "hammond": "Hammond", "wave-player": "Wave Player",
    "soundfont-player": "SoundFont Player", "mda-piano": "MDA Piano",
    "lfo": "LFO", "wavetable": "Wavetable", "adsr": "ADSR", "dx-envelope": "DX Envelope", "detune": "DeTune",
    "clock": "Clock", "step-arpeggiator": "Step Arpeggiator", "drum-sequencer": "Drum Sequencer",
    "sample-hold": "S&H - Sample and Hold", "burst-generator": "Burst Generator / Trigger Delay",
    "knob": "CC-Slider", "button": "CC Button", "up-down-button": "CC Up/Down Button",
    "switch": "Input-Switch", "multiplexer": "Input-Multiplexer",
    "output-switch": "Output Switch", "output-multiplexer": "Output Multiplexer", "const": "Const",
    "adder": "Adder", "divide": "Divide", "frequency-divider": "Frequency Divider",
    "multiplier": "Multiplier", "abs": "Abs", "value-mapper": "Value Mapper",
    "logic-and": "AND", "logic-or": "OR", "logic-xor": "XOR", "logic-not": "NOT",
    "filter": "Filter", "curtis-filter": "CEM3320 Filter", "esp-eq": "EQ", "graphic-eq": "8-Band EQ",
    "bitcrusher": "Bitcrusher", "wave-folder": "Wave Folder", "overdrive": "Overdrive", "envelope-follower": "Envelope Follower",
    "pan": "Pan", "chorus": "Chorus", "delay": "Delay", "reverb-light": "Reverb",
    "gain": "Gain/VCA", "mixer": "Mixer", "audio-out": "JS Audio-Out",
    "linked-input": "Link In", "linked-output": "Link Out",
    "linked-input-4": "Link In 4×", "linked-output-4": "Link Out 4×",
    "linked-input-8": "Link In 8×", "linked-output-8": "Link Out 8×",
    "usb-out": "USB-Out", "es8311-out": "ES8311-Out", "wm8960-out": "WM8960-Out", "ns4168-out": "NS4168-Out", "mic-in": "Mic-In",
    "annotation": "Annotation", "debug": "Debug", "voltmeter": "Voltmeter",
    "vu-meter": "VU-Meter", "vu-meter-horizontal": "VU-Meter Horizontal",
    "oscilloscope": "Oscilloscope", "spectrum": "Spectrum Analyzer",
    "cv-in": "CV In", "cv-out": "CV Out", "digital-in": "Digital In", "digital-out": "Digital Out", "rgb-led": "LED",
  };

  const params = new URLSearchParams(window.location.search);
  const type = params.get("type");
  const helpBody = document.getElementById("helpBody");

  if (type) {
    const label = WIDGET_LABELS[type] || type;
    document.getElementById("helpTitle").textContent = `${label} Help`;
    document.getElementById("helpType").textContent = `Widget type: ${type}`;

    fetch(`/help/widgets/${encodeURIComponent(type)}.html`)
      .then((res) => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return res.text();
      })
      .then((html) => {
        helpBody.innerHTML = html;
      })
      .catch(() => {
        // Leave the placeholder in place - this widget's help file doesn't exist yet.
      });
  }
</script>

</body>
</html>
